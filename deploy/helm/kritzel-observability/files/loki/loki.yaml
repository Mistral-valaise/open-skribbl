# Loki in single-binary mode for Kritzel (spec 015): OTLP ingestion on
# /otlp, filesystem storage, 24 h retention. Not highly available.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA_DIR:-/var/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR:-/var/loki}/chunks
      rules_directory: ${LOKI_DATA_DIR:-/var/loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-24h}
  allow_structured_metadata: true
  # Ingestion budget for one small game server.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 1000
  # Low-cardinality resource attributes become index labels; everything else,
  # including trace_id and span_id, stays structured metadata.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - deployment.environment.name

compactor:
  working_directory: ${LOKI_DATA_DIR:-/var/loki}/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

analytics:
  reporting_enabled: false
