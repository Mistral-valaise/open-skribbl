# Tempo in single-binary mode for Kritzel (spec 015): OTLP over HTTP from the
# collector, local block storage, 24 h retention. Not highly available.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION:-24h}

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 5000000
      burst_size_bytes: 10000000
      max_traces_per_user: 20000

usage_report:
  reporting_enabled: false
