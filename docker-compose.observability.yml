# Optional observability stack for Kritzel (spec 015). Use it as an overlay:
#
#   pnpm obs:up        # or: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# It turns telemetry on for the game and starts an OpenTelemetry Collector,
# Prometheus, Loki, Tempo and Grafana. Only Grafana is published, on
# http://127.0.0.1:3001, with a login. `docker compose up -d` without this
# file is unchanged. See docs/OBSERVABILITY.md.
services:
  kritzel:
    environment:
      TELEMETRY_ENABLED: 'true'
      RUM_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${KRITZEL_ENVIRONMENT:-local}
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: ['--config=/etc/otelcol/config.yaml']
    environment: &backend-hosts
      PROMETHEUS_HOST: prometheus
      LOKI_HOST: loki
      TEMPO_HOST: tempo
      GRAFANA_HOST: grafana
    volumes:
      - ./deploy/helm/kritzel-observability/files/collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/helm/kritzel-observability/files/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/kritzel-observability/files/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ['-config.file=/etc/loki/loki.yaml', '-config.expand-env=true']
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-24h}
    volumes:
      - ./deploy/helm/kritzel-observability/files/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ['-target=all', '-config.file=/etc/tempo/tempo.yaml', '-config.expand-env=true']
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-24h}
    volumes:
      - ./deploy/helm/kritzel-observability/files/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    environment:
      <<: *backend-hosts
      GF_SECURITY_ADMIN_USER: admin
      # No default: `pnpm obs:up` generates one into .env.observability.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD or use pnpm obs:up}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kritzel-overview.json
    volumes:
      - ./deploy/helm/kritzel-observability/files/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/kritzel-observability/files/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 384m

  # Synthetic traffic, so the dashboards and objectives have something to show:
  #   pnpm obs:traffic
  traffic:
    profiles: [traffic]
    build: .
    command: ['node', 'traffic.js']
    # The image's health check asks a server on this container; there is none here.
    healthcheck:
      disable: true
    environment:
      TRAFFIC_URL: http://kritzel:3000
      TRAFFIC_ROOMS: ${TRAFFIC_ROOMS:-2}
      TRAFFIC_PLAYERS: ${TRAFFIC_PLAYERS:-3}
      TRAFFIC_SEED: ${TRAFFIC_SEED:-1}
    depends_on:
      - kritzel
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
