# Service level objectives for Kritzel (spec 015). Sloth turns this file into
# Prometheus recording and multi-window burn-rate alert rules:
#
#   pnpm slo:generate
#
# The objectives are targets proposed for a team instance. They are not
# guarantees, and nothing here has been measured against production traffic.
version: prometheus/v1
service: kritzel
labels:
  owner: operator
  repo: open-skribbl
slos:
  - name: join-success
    objective: 99.9
    description: >-
      Valid joins succeed. A join refused because the room does not exist, is
      full, the player was kicked or sent an invalid name is the player's or
      host's doing and is not counted.
    sli:
      events:
        # Without a single failure the error series does not exist; `or vector(0)`
        # makes that a ratio of zero instead of no data.
        error_query: (sum(rate(kritzel_join_attempts_total{kritzel_validity="valid",kritzel_outcome="rejected"}[{{.window}}])) or vector(0))
        total_query: sum(rate(kritzel_join_attempts_total{kritzel_validity="valid"}[{{.window}}]))
    alerting:
      name: KritzelJoinSuccessBurn
      labels:
        category: availability
        owner: operator
      annotations:
        summary: Valid joins are failing faster than the error budget allows
        runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzeljoinsuccessburn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: ws-processing-latency
    objective: 99
    description: >-
      Inbound WebSocket messages are processed within 100 ms. Server-side
      only: from reading the frame to queuing the answers.
    sli:
      events:
        error_query: |
          sum(rate(kritzel_ws_message_duration_seconds_count[{{.window}}]))
          -
          sum(rate(kritzel_ws_message_duration_seconds_bucket{le="0.1"}[{{.window}}]))
        total_query: sum(rate(kritzel_ws_message_duration_seconds_count[{{.window}}]))
    alerting:
      name: KritzelWsLatencyBurn
      labels:
        category: latency
        owner: operator
      annotations:
        summary: WebSocket messages are processed too slowly
        runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelwslatencyburn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: reconnect-latency
    objective: 99
    description: >-
      A seat that reconnects is back within 5 s of losing its connection, as
      seen by the server. A player who stays away longer by choice counts
      against this objective too; see the measurement gaps in OBSERVABILITY.md.
    sli:
      events:
        error_query: |
          sum(rate(kritzel_reconnect_duration_seconds_count[{{.window}}]))
          -
          sum(rate(kritzel_reconnect_duration_seconds_bucket{le="5"}[{{.window}}]))
        total_query: sum(rate(kritzel_reconnect_duration_seconds_count[{{.window}}]))
    alerting:
      name: KritzelReconnectLatencyBurn
      labels:
        category: latency
        owner: operator
      annotations:
        summary: Reconnecting seats stay away longer than five seconds
        runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelreconnectlatencyburn
      page_alert:
        disable: true
      ticket_alert:
        labels:
          severity: warning

  - name: api-availability
    objective: 99.9
    description: >-
      Requests to the HTTP API are answered without a server error. A full
      server (503) counts as an error; a rate limit or an unknown room does not.
    sli:
      events:
        error_query: (sum(rate(http_server_request_duration_seconds_count{http_route=~"/api/.*",http_response_status_code=~"5.."}[{{.window}}])) or vector(0))
        total_query: sum(rate(http_server_request_duration_seconds_count{http_route=~"/api/.*"}[{{.window}}]))
    alerting:
      name: KritzelApiAvailabilityBurn
      labels:
        category: availability
        owner: operator
      annotations:
        summary: The HTTP API answers with server errors
        runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelapiavailabilityburn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
