name: Image test

# The tests of the container image: the container on its own, then a game
# through a reverse proxy that terminates TLS (spec 012). Defined once and
# called by CI, on an image built from the checkout, and by the release, on
# the digest it is about to promote (spec 017), so the two cannot drift.
#
# No `permissions` here: a called workflow can only narrow what its caller
# grants. CI grants `contents: read`; the release adds `packages: read`.
on:
  workflow_call:
    inputs:
      image:
        description: >-
          Image to pull and test, by digest (ghcr.io/owner/repo@sha256:…).
          Empty builds the image from the checkout.
        type: string
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    # A calling job cannot carry a limit, so it is set here (spec 017).
    timeout-minutes: 20
    env:
      IMAGE: ${{ inputs.image || 'kritzel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-playwright
      # The README quick start, literally.
      - if: inputs.image == ''
        run: docker build -t kritzel .
      - name: Pull the image
        if: inputs.image != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            ghcr.io/*) echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin ;;
          esac
          docker pull "$IMAGE"
      - run: docker run -d --name kritzel -p 3000:3000 "$IMAGE"
      - name: Tests against the container
        run: pnpm e2e
        env:
          KRITZEL_E2E_URL: http://127.0.0.1:3000
          KRITZEL_CONTAINER: kritzel
      - name: Start a TLS reverse proxy in front of the container
        run: |
          docker network create kritzel-net
          docker network connect kritzel-net kritzel
          docker run -d --name caddy --network kritzel-net -p 8443:8443 \
            caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 \
            caddy reverse-proxy --from https://localhost:8443 --to kritzel:3000
          sleep 5
      - name: Game through the proxy
        run: pnpm e2e container
        env:
          KRITZEL_E2E_URL: https://localhost:8443
          KRITZEL_CONTAINER: kritzel
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-e2e-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Container state and recent output
        if: failure()
        run: |
          docker ps --all
          docker logs --tail 80 kritzel || true
