# Grafana data sources for Kritzel (spec 015, "Correlation"). The UIDs are
# part of the contract: dashboards, rules and the links between signals use
# them.
apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://${PROMETHEUS_HOST}:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Metric -> trace: an exemplar on a span-duration histogram opens its trace.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://${LOKI_HOST}:3100
    editable: false
    jsonData:
      # Log -> trace: the trace id arrives as structured metadata.
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://${TEMPO_HOST}:3200
    editable: false
    jsonData:
      httpMethod: GET
      # Trace -> logs: the log lines written inside the trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # Not filtered by service: a browser span belongs to kritzel-web, its log lines to kritzel.
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
      # Trace -> metrics: rate and latency of the span's operation.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -15m
        spanEndTimeShift: 15m
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Request rate
            query: 'sum(rate(kritzel_span_calls_total{$$__tags, span_name="$${__span.name}"}[5m]))'
          - name: p95 duration
            query: 'histogram_quantile(0.95, sum by (le) (rate(kritzel_span_duration_seconds_bucket{$$__tags, span_name="$${__span.name}"}[5m])))'
      nodeGraph:
        enabled: true
      search:
        hide: false
