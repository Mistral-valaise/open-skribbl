{{- /* Tempo in single-binary mode: traces over OTLP from the collector (spec 015). */ -}}
{{- if .Values.observability.enabled }}
{{- $ctx := dict "root" . "component" "tempo" "storage" .Values.tempo.storage }}
{{- $config := .Files.Get "files/tempo/tempo.yaml" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
data:
  tempo.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kritzel.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{ include "kritzel.dataClaim" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kritzel.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kritzel.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      serviceAccountName: {{ include "kritzel.componentName" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "kritzel.podSecurityContext" . | nindent 8 }}
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args:
            - -target=all
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          securityContext:
            {{- include "kritzel.containerSecurityContext" . | nindent 12 }}
          env:
            - name: TEMPO_RETENTION
              value: {{ .Values.tempo.retention | quote }}
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-http
              containerPort: 4318
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: {{ include "kritzel.componentName" $ctx }}
        {{- include "kritzel.dataVolume" $ctx | nindent 8 }}
{{- end }}
