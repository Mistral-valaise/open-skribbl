# Threshold alerts for Kritzel (spec 015). Burn-rate alerts for the service
# level objectives are generated by Sloth into sloth-kritzel.yaml; the alerts
# here cover what an objective cannot: missing data, saturation and abuse.
#
# Every alert that depends on traffic has a minimum-volume guard, so a quiet
# instance does not page anyone, and every alert links to its runbook section.
groups:
  - name: kritzel-availability
    rules:
      - alert: KritzelTelemetryMissing
        # No-data alert: the game reports this gauge on every export, also at zero.
        expr: absent(kritzel_rooms_active)
        for: 5m
        labels:
          severity: warning
          owner: operator
        annotations:
          summary: Kritzel has not reported metrics for five minutes
          description: >-
            Either the game is down, telemetry is switched off, or the path
            game -> collector -> Prometheus is broken. Players may be unaffected.
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzeltelemetrymissing

      - alert: KritzelServerFull
        expr: sum(increase(kritzel_rooms_create_attempts_total{kritzel_reason="server_full"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
          owner: operator
        annotations:
          summary: Room creation is refused because MAX_ROOMS is reached
          description: '{{ $value | printf "%.0f" }} room creations were refused in the last ten minutes.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelserverfull

  - name: kritzel-saturation
    rules:
      - alert: KritzelEventLoopLag
        expr: max(nodejs_eventloop_delay_p99_seconds) > 0.1
        for: 5m
        labels:
          severity: warning
          owner: operator
        annotations:
          summary: The game's event loop is delayed by more than 100 ms
          description: 'p99 event-loop delay is {{ $value | humanizeDuration }}; drawing will feel laggy.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzeleventlooplag

      - alert: KritzelHeapNearLimit
        expr: max(v8js_memory_heap_used_bytes / v8js_memory_heap_limit_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
          owner: operator
        annotations:
          summary: The game uses more than 85 % of its heap limit
          description: 'Heap usage is at {{ $value | humanizePercentage }} of the limit.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelheapnearlimit

  - name: kritzel-abuse
    rules:
      - alert: KritzelRejectedMessageSurge
        # More than one message in five is refused, and there is enough traffic to judge.
        expr: |
          sum(rate(kritzel_ws_messages_total{kritzel_outcome="rejected"}[5m]))
            /
          sum(rate(kritzel_ws_messages_total[5m])) > 0.2
          and
          sum(rate(kritzel_ws_messages_total[5m])) > 1
        for: 10m
        labels:
          severity: info
          owner: operator
        annotations:
          summary: An unusual share of WebSocket messages is being rejected
          description: '{{ $value | humanizePercentage }} of inbound messages were refused over five minutes.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelrejectedmessagesurge

      - alert: KritzelRateLimitSurge
        expr: sum by (kritzel_scope) (rate(kritzel_rate_limit_hits_total[5m])) > 2
        for: 10m
        labels:
          severity: info
          owner: operator
        annotations:
          summary: 'The {{ $labels.kritzel_scope }} rate limit is hit continuously'
          description: '{{ $value | printf "%.1f" }} refusals per second for ten minutes.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzelratelimitsurge

  - name: kritzel-telemetry
    rules:
      - alert: KritzelTelemetryDropped
        # The game's own queues are full: the collector is slow or unreachable.
        expr: sum(rate({__name__=~"otel_sdk_processor_(span|log)_processed_total", error_type="queue_full"}[5m])) > 0
        for: 10m
        labels:
          severity: info
          owner: operator
        annotations:
          summary: The game is dropping spans or log records because an export queue is full
          description: 'Gameplay is unaffected; traces and exported logs are incomplete.'
          runbook_url: https://github.com/Mistral-valaise/open-skribbl/blob/main/docs/RUNBOOK.md#kritzeltelemetrydropped
