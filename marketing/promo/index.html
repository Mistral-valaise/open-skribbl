<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kritzel — promo film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>

        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #paper {

        inset: 0;
        background: #ffffff;
