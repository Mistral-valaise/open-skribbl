{{- /* Grafana: provisioned data sources and dashboards, always behind its login (spec 015). */ -}}
{{- if .Values.observability.enabled }}
{{- if not .Values.grafana.existingSecret }}
{{- fail "grafana.existingSecret is required when observability.enabled is true: create a Secret with the key admin-password in the namespace and name it here. The chart never holds a password." }}
{{- end }}
{{- $ctx := dict "root" . "component" "grafana" }}
{{- $datasources := .Files.Get "files/grafana/provisioning/datasources/datasources.yaml" }}
{{- $provider := .Files.Get "files/grafana/provisioning/dashboards/dashboards.yaml" }}
{{- $dashboards := .Files.Glob "files/grafana/dashboards/*.json" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kritzel.componentName" $ctx }}-provisioning
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
data:
  datasources.yaml: |
    {{- $datasources | nindent 4 }}
  dashboards.yaml: |
    {{- $provider | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kritzel.componentName" $ctx }}-dashboards
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
data:
  {{- $dashboards.AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kritzel.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kritzel.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kritzel.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s%s" $datasources $provider $dashboards.AsConfig | sha256sum }}
    spec:
      serviceAccountName: {{ include "kritzel.componentName" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        {{- include "kritzel.podSecurityContext" . | nindent 8 }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          securityContext:
            {{- include "kritzel.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "kritzel.backendHosts" . | nindent 12 }}
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # The password never passes through the chart.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.existingSecret }}
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_SECURITY_COOKIE_SECURE
              value: {{ .Values.grafana.route.enabled | quote }}
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: 'false'
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: 'true'
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: 'false'
            - name: GF_LOG_MODE
              value: console
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/kritzel-overview.json
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "kritzel.componentName" $ctx }}-provisioning
        - name: dashboards
          configMap:
            name: {{ include "kritzel.componentName" $ctx }}-dashboards
        # Grafana's own database: users, sessions, preferences. Lost on restart;
        # everything that matters is provisioned from files.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
