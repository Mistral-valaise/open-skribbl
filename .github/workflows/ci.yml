name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The chart tests render the Helm chart (spec 016); the version the
      # deployment uses, verified by checksum.
      - name: Install helm
        env:
          HELM_VERSION: v4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file helm.tar.gz --strip-components 1 --directory bin linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The README quick start, literally.
      - run: docker build -t kritzel .
      - run: docker run -d --name kritzel -p 3000:3000 kritzel
      - name: Tests against the container
        run: pnpm e2e
        env:
          KRITZEL_E2E_URL: http://127.0.0.1:3000
          KRITZEL_CONTAINER: kritzel
      - name: Start a TLS reverse proxy in front of the container
        run: |
          docker network create kritzel-net
          docker network connect kritzel-net kritzel
          docker run -d --name caddy --network kritzel-net -p 8443:8443 caddy:2-alpine \
            caddy reverse-proxy --from https://localhost:8443 --to kritzel:3000
          sleep 5
      - name: Game through the proxy
        run: pnpm e2e container
        env:
          KRITZEL_E2E_URL: https://localhost:8443
          KRITZEL_CONTAINER: kritzel

  # The local observability stack, started the documented way and checked
  # through its real APIs (spec 015).
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm obs:up
      - name: Signals, correlation, redaction and objectives
        run: pnpm exec playwright test e2e/observability.spec.ts
        env:
          KRITZEL_OBS: '1'
      - name: Container state and recent output
        if: failure()
        run: |
          docker compose --env-file .env.observability -f docker-compose.yml -f docker-compose.observability.yml ps
          docker compose --env-file .env.observability -f docker-compose.yml -f docker-compose.observability.yml logs --tail 80 --no-color
      - run: pnpm obs:down
        if: always()
