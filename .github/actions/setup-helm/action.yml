name: Setup Helm
description: Download the pinned Helm binary, verify its SHA-256 checksum, and add it to PATH.
runs:
  using: composite
  steps:
    - name: Install helm, verified by checksum
      shell: bash
      env:
        HELM_VERSION: v4.3.1
        HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" \
          "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum --check --strict
        tar --extract --gzip --file "$RUNNER_TEMP/helm.tar.gz" --strip-components 1 --directory "$RUNNER_TEMP/bin" linux-amd64/helm
        rm -f "$RUNNER_TEMP/helm.tar.gz"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
