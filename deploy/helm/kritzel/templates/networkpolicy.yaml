{{- /*
Who may connect to the standalone game release (spec 016, "Chart").
Each policy selects one component and lists its callers; a pod selected by a
policy accepts nothing else. Egress is left open: restricting it needs the
cluster's DNS selectors, which differ between platforms.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $game := dict "root" . "component" "game" }}
{{- $traffic := dict "root" . "component" "traffic" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kritzel.componentName" $game }}
  labels:
    {{- include "kritzel.labels" $game | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kritzel.selectorLabels" $game | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Players, through the ingress controller or router.
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- include "kritzel.ingressFrom" . | nindent 6 }}
    {{- if .Values.traffic.enabled }}
    # Synthetic players.
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      from:
        {{- include "kritzel.peer" $traffic | nindent 8 }}
    {{- end }}
{{- if .Values.traffic.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kritzel.componentName" $traffic }}
  labels:
    {{- include "kritzel.labels" $traffic | nindent 4 }}
spec:
  # Nothing connects to the traffic generator.
  podSelector:
    matchLabels:
      {{- include "kritzel.selectorLabels" $traffic | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
{{- end }}
