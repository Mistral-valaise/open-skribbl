{{- /* Prometheus: receives everything by remote write and evaluates the rules (spec 015). */ -}}
{{- if .Values.observability.enabled }}
{{- $ctx := dict "root" . "component" "prometheus" "storage" .Values.prometheus.storage }}
{{- $config := .Files.Get "files/prometheus/prometheus.yml" }}
{{- $rules := .Files.Glob "files/prometheus/rules/*.yaml" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
data:
  prometheus.yml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kritzel.componentName" $ctx }}-rules
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
data:
  {{- $rules.AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kritzel.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{ include "kritzel.dataClaim" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kritzel.componentName" $ctx }}
  labels:
    {{- include "kritzel.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kritzel.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kritzel.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" $config $rules.AsConfig | sha256sum }}
    spec:
      serviceAccountName: {{ include "kritzel.componentName" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "kritzel.podSecurityContext" . | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
            - --web.enable-remote-write-receiver
            - --enable-feature=exemplar-storage
          securityContext:
            {{- include "kritzel.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "kritzel.componentName" $ctx }}
        - name: rules
          configMap:
            name: {{ include "kritzel.componentName" $ctx }}-rules
        {{- include "kritzel.dataVolume" $ctx | nindent 8 }}
{{- end }}
