name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-helm
      - name: Cache observability Helm dependencies
        id: helm-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/kritzel-observability/charts
          key: ${{ runner.os }}-helm-obs-${{ hashFiles('deploy/helm/kritzel-observability/Chart.lock') }}
      - name: Build observability Helm dependencies
        if: steps.helm-deps.outputs.cache-hit != 'true'
        run: helm dependency build deploy/helm/kritzel-observability
      - run: pnpm check
      - name: Check package and chart version sync
        run: node scripts/release-prepare.mjs --check
      - name: Spec coverage summary
        if: always()
        run: |
          {
            echo "## Spec coverage"
            echo ""
            echo '```text'
            pnpm spec:coverage || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # GitHub refuses a workflow file with an invalid expression only after
      # it is merged; actionlint says so before.
      - name: Lint the workflows
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-playwright
      - run: pnpm e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The image, built the way the README says, started and played through, also
  # behind a TLS proxy. The release runs the same workflow on the digest it
  # publishes (spec 017).
  container:
    uses: ./.github/workflows/image-test.yml

  # The local observability stack, started the documented way and checked
  # through its real APIs (spec 015).
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-playwright
      - run: pnpm obs:up
      - name: Signals, correlation, redaction and objectives
        run: pnpm exec playwright test e2e/observability.spec.ts
        env:
          KRITZEL_OBS: '1'
      - name: Container state and recent output
        if: failure()
        run: |
          docker compose --env-file .env.observability -f docker-compose.yml -f docker-compose.observability.yml ps
          docker compose --env-file .env.observability -f docker-compose.yml -f docker-compose.observability.yml logs --tail 80 --no-color
      - name: Upload observability failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observability-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm obs:down
        if: always()
