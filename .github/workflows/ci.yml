name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The README quick start, literally.
      - run: docker build -t kritzel .
      - run: docker run -d --name kritzel -p 3000:3000 kritzel
      - name: Tests against the container
        run: pnpm e2e
        env:
          KRITZEL_E2E_URL: http://127.0.0.1:3000
          KRITZEL_CONTAINER: kritzel
      - name: Start a TLS reverse proxy in front of the container
        run: |
          docker network create kritzel-net
          docker network connect kritzel-net kritzel
          docker run -d --name caddy --network kritzel-net -p 8443:8443 caddy:2-alpine \
            caddy reverse-proxy --from https://localhost:8443 --to kritzel:3000
          sleep 5
      - name: Game through the proxy
        run: pnpm e2e container
        env:
          KRITZEL_E2E_URL: https://localhost:8443
          KRITZEL_CONTAINER: kritzel
